name: Deploy User Interface to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "user_interface/**"
      - ".github/workflows/deploy_user_interface.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: user_interface

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4